# LiveKit Server Production Config
# CATATAN: API keys dikelola via env LIVEKIT_KEYS di docker-compose
port: 7880

rtc:
  # Paksa LiveKit memakai port TETAP, bukan port random!
  # Port ini harus sama dengan yang di-expose Docker dan dibuka di firewall
  udp_port: 7881
  tcp_port: 7882
  use_external_ip: true   # Auto-detect public IP via STUN

logging:
  level: info
