version: '3.8'

services:

  # Frontend Web
  frontend:
    build:
      context: ./smartumroh-tourguide
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BACKEND_URL}
        VITE_LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
    container_name: smartumroh-muthowif-app-prod
    depends_on:
      - backend
    ports:
      - "8650:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend Next.js API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartumroh-backend-prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_started
    ports:
      - "8651:8651"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8651/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # LiveKit Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server-prod
    # Gunakan config file agar UDP/TCP port TETAP (bukan random)
    # --node-ip wajib diisi IP public VPS agar ICE candidates benar
    command: --config /config/livekit.yaml --node-ip=${VPS_PUBLIC_IP} --redis.address=redis:6379
    volumes:
      - ./livekit.yaml:/config/livekit.yaml:ro
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7880:7880"         # WebSocket signaling
      - "7881:7881/udp"     # WebRTC media UDP - port TETAP (bukan random!)
      - "7882:7882/tcp"     # WebRTC media TCP fallback
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880/ > /dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (dibutuhkan LiveKit Production)
  redis:
    image: redis:7-alpine
    container_name: livekit-redis-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: smartumroh-muthowif-db-prod
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=smartumroh
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartumroh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Database Backup Auto
  db-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: smartumroh-muthowif-db-backup-prod
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=smartumroh
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7

volumes:
  postgres_data_prod:
