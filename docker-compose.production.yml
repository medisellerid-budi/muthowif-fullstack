version: '3.8'

services:

  # Frontend Web
  frontend:
    build:
      context: ./smartumroh-tourguide
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BACKEND_URL}
        VITE_LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
    container_name: smartumroh-muthowif-app-prod
    depends_on:
      - backend
    ports:
      - "8650:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend Next.js API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartumroh-backend-prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_started
    ports:
      - "8651:8651"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8651/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # LiveKit Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server-prod
    command: --node-ip=0.0.0.0 --redis.address=redis:6379
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7880:7880"
      - "7881:7881/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (dibutuhkan LiveKit Production)
  redis:
    image: redis:7-alpine
    container_name: livekit-redis-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: smartumroh-muthowif-db-prod
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=StrongProdPassword123
      - POSTGRES_DB=smartumroh
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartumroh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Database Backup Auto
  db-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: smartumroh-muthowif-db-backup-prod
    restart: unless-stopped
    user: postgres:postgres
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=smartumroh
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=StrongProdPassword123
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7

volumes:
  postgres_data_prod:
